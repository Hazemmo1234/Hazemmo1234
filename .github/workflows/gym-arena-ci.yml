name: gym-arena CI

# D25 (docs/TEST_PLAN.md "Continuous integration").
# Every job uses only a DISPOSABLE local Supabase stack created inside the runner.
# This workflow holds no cloud credentials, never links the CLI and never passes
# --remote / --linked, so it cannot reach a real project.

on:
  push:
    paths: ["gym-arena/**", ".github/workflows/gym-arena-ci.yml"]
  pull_request:
    paths: ["gym-arena/**", ".github/workflows/gym-arena-ci.yml"]

permissions:
  contents: read

concurrency:
  group: gym-arena-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: gym-arena

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gym-arena/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # placeholders only — the build needs the variable names, not a real project
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gym-arena/package-lock.json
      - run: npm ci
      - run: npm run build

  database:
    name: Database, RLS and security regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gym-arena/package-lock.json
      - run: npm ci
      - name: Refuse to run if the CLI is linked or cloud credentials are present
        run: |
          test ! -f supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
      # The job's OWN stack: project gym-arena-ci, API 58321, DB 58322 — never the identity or the
      # ports of a developer's stack (gym-arena, 54321/54322). `start` refuses an existing stack.
      - name: Start this job's disposable stack (clean migrations + seed, project gym-arena-ci)
        run: bash scripts/disposable-stack.sh gym-arena-ci start
      - name: Export its settings (keys masked, never printed)
        run: bash scripts/disposable-stack.sh gym-arena-ci env-github
      # The test runner's global setup verifies the ACTUAL stack (containers, project label, ports,
      # volume, and that TEST_DATABASE_URL reaches the database in that container) before any test.
      - run: npm run test:db
        env:
          TEST_DB_ISOLATED: "1"
          GYM_ARENA_CI_DISPOSABLE: "1" # explicit opt-in for the gym-arena-ci profile, test steps only
      - name: Stop the stack and discard its data
        if: always()
        run: bash scripts/disposable-stack.sh gym-arena-ci destroy > /dev/null 2>&1 || true

  e2e:
    name: End-to-end (phone + TV, Arabic + English)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gym-arena/package-lock.json
      - run: npm ci
      - name: Refuse to run if the CLI is linked or cloud credentials are present
        run: |
          test ! -f supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
      - run: npx playwright install --with-deps chromium
      - name: Start this job's disposable stack (clean migrations + seed, project gym-arena-ci)
        run: bash scripts/disposable-stack.sh gym-arena-ci start
      - name: Export its settings (keys masked, never printed)
        run: bash scripts/disposable-stack.sh gym-arena-ci env-github
      - run: npm run build
      # The browser suite runs over plain http://localhost. Auth cookies are Secure unless the
      # SERVER's own config allows local plain HTTP (src/lib/supabase/cookie-security.ts). The
      # test-only flag below does that for this step's server, only inside GitHub Actions and only
      # for requests from this machine; it is read at runtime, so the build above does not need it.
      # Every deployment runs without it (and the operator preflight refuses it).
      # Playwright's global setup verifies the ACTUAL stack before any test (as in the DB job).
      - run: npm run test:e2e
        env:
          E2E_ALLOW_WRITES: "1" # opt-in for @writes tests
          GYM_ARENA_CI_DISPOSABLE: "1" # explicit opt-in for the gym-arena-ci profile, test steps only
          AUTH_COOKIES_ALLOW_LOCAL_HTTP: "1" # local plain-HTTP auth cookies, this step's server only
      # Real-server cookie check: starts the same build (and next dev) once per server
      # configuration and reads the Set-Cookie each actually sends (tests/integration).
      # The test sets every server's environment itself, so the flag is deliberately absent here.
      - run: npm run test:cookies
        env:
          GYM_ARENA_CI_DISPOSABLE: "1" # explicit opt-in for the gym-arena-ci profile, test steps only
      - name: Keep the browser test report when the job fails (diagnostics; local test data only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: gym-arena/test-results/
          retention-days: 7
      - name: Stop the stack and discard its data
        if: always()
        run: bash scripts/disposable-stack.sh gym-arena-ci destroy > /dev/null 2>&1 || true
